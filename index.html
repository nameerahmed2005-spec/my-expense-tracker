<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Expense Tracker</title>

<style>

/* ============================= */
/* PREMIUM DARK GLASS UI (RESTORED) */
/* ============================= */

:root{
--bg1:#0b1220;
--bg2:#070a12;
--bg3:#05070d;

--card1:#161a24;
--card2:#0e1118;

--text:#e6e6e6;
--border:#1c2433;
--primary:#22c55e;
}

/* Background */
body{
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto;
margin:0;
padding:20px;
display:flex;
justify-content:center;
color:var(--text);

background:
radial-gradient(circle at top, var(--bg1) 0%, var(--bg2) 60%, var(--bg3) 100%);
}

/* Main Card */
.container{

width:100%;
max-width:500px;
padding:25px;

border-radius:18px;

background:
linear-gradient(145deg, rgba(22,26,36,0.9), rgba(14,17,24,0.9));

box-shadow:
0 20px 50px rgba(0,0,0,0.6),
inset 0 1px 0 rgba(255,255,255,0.03);

backdrop-filter: blur(14px);

position:relative;
}

/* DO NOT TOUCH amount + note inputs */
/* only general styles */

input,select{

width:100%;
box-sizing:border-box;   /* ⭐ THIS FIXES OVERFLOW */

padding:14px;
margin-bottom:12px;
border-radius:12px;

background:#0b0f17;
color:var(--text);

font-size:16px;
}


/* Dropdown style (NOT amount/note) */
select{
border:1px solid var(--border);

box-shadow:
inset 0 3px 8px rgba(0,0,0,0.6);
}

/* Add Button */
#addBtn{

width:100%;
padding:14px;

background:var(--primary);
color:white;

border:none;
border-radius:14px;

cursor:pointer;
}

/* Expense Item Cards */
li{

background:
linear-gradient(145deg,#0f1420,#0c1019);

padding:14px;
margin-bottom:12px;

border-radius:14px;

display:flex;
justify-content:space-between;
align-items:flex-start;

border:1px solid #141a26;

box-shadow:
0 8px 20px rgba(0,0,0,0.5),
inset 0 1px 0 rgba(255,255,255,0.02);
}

/* Small buttons */
.small-btn{

padding:6px 12px;
margin-left:6px;

background:#2c313c;
border:none;

border-radius:8px;
cursor:pointer;
}

/* Theme Toggle */
.theme-toggle{

position:absolute;
top:15px;
right:15px;

border:none;

background:
linear-gradient(145deg,#1c2230,#141a26);

border-radius:50%;

width:40px;
height:40px;

cursor:pointer;

box-shadow:
0 6px 15px rgba(0,0,0,0.6),
inset 0 1px 0 rgba(255,255,255,0.05);
}

/* LIGHT MODE */

body.light{

background:
radial-gradient(circle at top,#f3f4f8 0%,#e8ebf1 60%,#dde1e8 100%);

color:#111;
}

body.light .container{
background:
linear-gradient(145deg,#ffffff,#f4f6fb);

box-shadow:
0 20px 50px rgba(0,0,0,0.08),
inset 0 1px 0 rgba(255,255,255,0.8);
}

body.light input,
body.light select{
background:#ffffff;
color:#111;
border:1px solid #ddd;
}

body.light li{
background:#f7f8fb;
border:1px solid #e5e7eb;
}

body.light .theme-toggle{
background:#f1f5f9;
}

/* WHITE BUTTON TEXT */
.small-btn{
color:white;
}

.day-header{
text-align:left;
width:100%;
margin:10px 0 6px 0;
}

li span{
text-align:left;
display:block;
}

</style>

</head>

<body>

<div class="container">

<button id="themeToggle" class="theme-toggle">🌙</button>

<h2>Expense Tracker</h2>

<input id="amount" type="number" placeholder="Amount">

<select id="category">
<option>Food</option>
<option>Travel</option>
<option>Misc</option>
</select>

<input id="note" placeholder="Optional Note">

<button id="addBtn">Add</button>

<h3 id="grandTotal">Grand Total Rs 0</h3>

<ul id="expenseList"></ul>

</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script>

const firebaseConfig={
apiKey:"AIzaSyCCupf8EtI4Lk3bpNFgLs2B_-NsozHQS1g",
authDomain:"expense-tracker-2796a.firebaseapp.com",
databaseURL:"https://expense-tracker-2796a-default-rtdb.asia-southeast1.firebasedatabase.app",
projectId:"expense-tracker-2796a"
};

firebase.initializeApp(firebaseConfig);

const db=firebase.database();
const expensesRef=db.ref("expenses");

let expenses={};
let editingID=null;
let editingDate=null;

const addBtn=document.getElementById("addBtn");
const themeBtn=document.getElementById("themeToggle");
const grandTotalEl=document.getElementById("grandTotal");

/* THEME FIX */

/* ===== LIGHT MODE ===== */

function applyTheme(){
if(localStorage.getItem("theme")==="light"){
document.body.classList.add("light");
themeBtn.textContent="☀️";
}else{
document.body.classList.remove("light");
themeBtn.textContent="🌙";
}
}

themeBtn.onclick=()=>{
if(document.body.classList.contains("light")){
localStorage.setItem("theme","dark");
}else{
localStorage.setItem("theme","light");
}
applyTheme();
};

if(!localStorage.getItem("theme")){
localStorage.setItem("theme","dark");
}
applyTheme();

/* 7AM LOGICAL DATE */

function getLogicalDate(){
const d=new Date();
d.setHours(d.getHours()-7);
return d.toISOString().split("T")[0];
}

/* SYNC */

expensesRef.on("value",(snapshot)=>{
expenses=snapshot.val()||{};
renderExpenses();
});

function renderExpenses(){

expenseList.innerHTML="";

let grandTotal=0;
let grouped={};

Object.entries(expenses).forEach(([id,exp])=>{

const date=exp.date || "No Date";

if(!grouped[date]) grouped[date]=[];

grouped[date].push({id,...exp});

grandTotal+=Number(exp.amount||0);

});

grandTotalEl.textContent="Grand Total Rs "+grandTotal;

Object.entries(grouped).forEach(([day,entries])=>{

let dayTotal=0;
entries.forEach(e=>dayTotal+=Number(e.amount||0));

const header=document.createElement("div");
header.className="day-header";
header.textContent=`${day} — Daily Total Rs ${dayTotal}`;
expenseList.appendChild(header);

entries.forEach(exp=>{

const li=document.createElement("li");

const text=document.createElement("span");
text.textContent=`Rs ${exp.amount} - ${exp.category||''} ${exp.note?'('+exp.note+')':''}`;

const editBtn=document.createElement("button");
editBtn.textContent="Edit";
editBtn.className="small-btn";

editBtn.onclick=()=>{
amount.value=exp.amount;
category.value=exp.category;
note.value=exp.note;
editingID=exp.id;
editingDate=exp.date;
addBtn.textContent="Update";
};

const deleteBtn=document.createElement("button");
deleteBtn.textContent="Delete";
deleteBtn.className="small-btn";

deleteBtn.onclick=()=>{
if(confirm("Delete this expense?")){
expensesRef.child(exp.id).remove();
}
};

const btns=document.createElement("div");
btns.appendChild(editBtn);
btns.appendChild(deleteBtn);

li.appendChild(text);
li.appendChild(btns);

expenseList.appendChild(li);

});

});

}

/* ADD / UPDATE */

addBtn.onclick=()=>{

if(!amount.value) return;

const data={
amount:amount.value,
category:category.value,
note:note.value
};

if(editingID){

if(editingDate!==undefined) data.date=editingDate;

expensesRef.child(editingID).set(data);

editingID=null;
editingDate=null;
addBtn.textContent="Add";

}else{

data.date=getLogicalDate();
expensesRef.push(data);

}

amount.value="";
note.value="";
};

</script>

</body>
</html>
