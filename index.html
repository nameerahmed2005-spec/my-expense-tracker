<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Expense Tracker</title>

<style>

body{
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto;
background:#f6f7fb;
margin:0;
padding:20px;
display:flex;
justify-content:center;
}

.container{
width:100%;
max-width:500px;
background:white;
padding:25px;
border-radius:14px;
box-shadow:0 10px 25px rgba(0,0,0,0.08);
}

h2{
text-align:center;
margin-bottom:20px;
font-weight:600;
}

input,select{
width:100%;
padding:14px;
margin-bottom:12px;
border-radius:8px;
border:1px solid #ddd;
font-size:16px;
transition:0.2s;
}

input:focus,select:focus{
outline:none;
border-color:#4caf50;
box-shadow:0 0 0 2px rgba(76,175,80,0.2);
}

button{
width:100%;
padding:14px;
background:#4caf50;
color:white;
border:none;
border-radius:8px;
font-size:17px;
font-weight:500;
cursor:pointer;
transition:0.2s;
}

button:hover{
background:#43a047;
}

h3{
margin-top:20px;
font-weight:600;
}

ul{
list-style:none;
padding:0;
margin-top:15px;
}

li{
background:#fafafa;
padding:14px;
margin-bottom:10px;
border-radius:10px;
display:flex;
justify-content:space-between;
align-items:center;
border:1px solid #eee;
}

.small-btn{
width:auto;
padding:6px 12px;
margin-left:6px;
border-radius:6px;
font-size:14px;
}

</style>


</head>

<body>
<div class="container">


<h2>Expense Tracker</h2>

<input id="amount" type="number" placeholder="Amount">
<select id="category">
<option>Food</option>
<option>Travel</option>
<option>Misc</option>
</select>
<input id="note" placeholder="Optional Note">

<button id="addBtn">Add</button>

<h3>Total Rs <span id="dailyTotal">0</span></h3>

<ul id="expenseList"></ul>

<!-- FIREBASE NON-MODULE VERSION -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script>

const firebaseConfig = {
apiKey:"AIzaSyCCupf8EtI4Lk3bpNFgLs2B_-NsozHQS1g",
authDomain:"expense-tracker-2796a.firebaseapp.com",
databaseURL:"https://expense-tracker-2796a-default-rtdb.asia-southeast1.firebasedatabase.app",
projectId:"expense-tracker-2796a",
storageBucket:"expense-tracker-2796a.firebasestorage.app",
messagingSenderId:"246479741004",
appId:"1:246479741004:web:f486279bd9395547e114e9"
};


firebase.initializeApp(firebaseConfig);

const db=firebase.database();
const expensesRef=db.ref("expenses");

let expenses={};
let editingID=null;

const addBtn=document.getElementById("addBtn");

expensesRef.on("value",(snapshot)=>{
expenses=snapshot.val()||{};
renderExpenses();
});

function renderExpenses(){

const list=document.getElementById("expenseList");
list.innerHTML="";
let total=0;

Object.entries(expenses).forEach(([id,exp])=>{

const li=document.createElement("li");

const text=document.createElement("span");
text.textContent=
`Rs ${exp.amount} - ${exp.category} ${exp.note? '('+exp.note+')':''}`;

const editBtn=document.createElement("button");
editBtn.textContent="Edit";
editBtn.className="small-btn";

editBtn.onclick=()=>{
document.getElementById("amount").value=exp.amount;
document.getElementById("category").value=exp.category;
document.getElementById("note").value=exp.note;
editingID=id;
addBtn.textContent="Update";
};

const deleteBtn=document.createElement("button");
deleteBtn.textContent="Delete";
deleteBtn.className="small-btn";

deleteBtn.onclick=()=>{
if(confirm("Delete this expense?")){
expensesRef.child(id).remove();
}
};

const btns=document.createElement("div");
btns.appendChild(editBtn);
btns.appendChild(deleteBtn);

li.appendChild(text);
li.appendChild(btns);
list.appendChild(li);

total+=Number(exp.amount);

});

document.getElementById("dailyTotal").textContent=total;
}

addBtn.onclick=()=>{

const amountVal=document.getElementById("amount").value;
const categoryVal=document.getElementById("category").value;
const noteVal=document.getElementById("note").value;

if(!amountVal) return;

if(editingID){

expensesRef.child(editingID).set({
amount:amountVal,
category:categoryVal,
note:noteVal
});

editingID=null;
addBtn.textContent="Add";

}else{

expensesRef.push({
amount:amountVal,
category:categoryVal,
note:noteVal
});
}

document.getElementById("amount").value="";
document.getElementById("note").value="";
};

</script>

</div>
</body>
</html>
