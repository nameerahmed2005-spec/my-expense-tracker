<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Expense Tracker</title>
</head>

<body style="font-family:Arial;max-width:500px;margin:auto;padding:20px;background:#f6f7fb;">

<h2>Expense Tracker</h2>

<input id="amount" placeholder="Amount"><br><br>

<select id="category">
<option>Food</option>
<option>Travel</option>
<option>Misc</option>
</select><br><br>

<input id="note" placeholder="Optional Note"><br><br>

<button id="addBtn">Add</button>

<h3 id="grandTotal">Grand Total Rs 0</h3>

<div id="expenseList"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script>

const firebaseConfig={
apiKey:"AIzaSyCCupf8EtI4Lk3bpNFgLs2B_-NsozHQS1g",
authDomain:"expense-tracker-2796a.firebaseapp.com",
databaseURL:"https://expense-tracker-2796a-default-rtdb.firebaseio.com",
projectId:"expense-tracker-2796a",
storageBucket:"expense-tracker-2796a.firebasestorage.app",
messagingSenderId:"246479741004",
appId:"1:246479741004:web:f486279bd9395547e114e9"
};

firebase.initializeApp(firebaseConfig);

const db=firebase.database();
const expensesRef=db.ref("expenses");

let expenses={};
let editingID=null;

/* ⭐ 7AM LOGICAL DATE */
function getLogicalDate(){

const d=new Date();
d.setHours(d.getHours()-7);
return d.toISOString().split("T")[0];

}

expensesRef.on("value",(snapshot)=>{

expenses=snapshot.val()||{};
render();

});

function render(){

const container=document.getElementById("expenseList");
container.innerHTML="";

let grouped={};
let grandTotal=0;

/* BACKWARD COMPATIBILITY */
Object.entries(expenses).forEach(([id,exp])=>{

const date=exp.date || "old";

if(!grouped[date]) grouped[date]=[];

grouped[date].push({id,...exp});

grandTotal+=Number(exp.amount);

});

document.getElementById("grandTotal").textContent=
"Grand Total Rs "+grandTotal;

Object.entries(grouped).sort().reverse().forEach(([day,entries])=>{

let dayTotal=0;
entries.forEach(e=>dayTotal+=Number(e.amount));

const header=document.createElement("h4");
header.textContent=day+" — Daily Total Rs "+dayTotal;

container.appendChild(header);

entries.forEach(exp=>{

const div=document.createElement("div");

div.innerHTML=
"Rs "+exp.amount+" - "+exp.category+" "+(exp.note||"");

const del=document.createElement("button");
del.textContent="Delete";

del.onclick=()=>{
if(confirm("Delete?")){
expensesRef.child(exp.id).remove();
}
};

div.appendChild(del);
container.appendChild(div);

});

});

}

document.getElementById("addBtn").onclick=()=>{

const amount=document.getElementById("amount").value;
const category=document.getElementById("category").value;
const note=document.getElementById("note").value;

if(!amount) return;

expensesRef.push({
amount:amount,
category:category,
note:note,
date:getLogicalDate()
});

};

</script>

</body>
</html>
