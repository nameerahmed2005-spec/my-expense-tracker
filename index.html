<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Expense Tracker</title>

<style>

:root{
--bg:#f6f7fb;
--card:#ffffff;
--text:#111;
--input-bg:#ffffff;
--border:#e5e7eb;
--item:#fafafa;
--primary:#22c55e;
--neutral:#e5e7eb;
}

.dark{
--bg:#0f1115;
--card:#1a1d24;
--text:#e6e6e6;
--input-bg:#12151b;
--border:#2c313c;
--item:#151922;
--neutral:#2c313c;
}

body{
font-family:Segoe UI;
background:var(--bg);
padding:20px;
display:flex;
justify-content:center;
color:var(--text);
}

.container{
max-width:500px;
width:100%;
background:var(--card);
padding:20px;
border-radius:12px;
position:relative;
}

/* ⭐ ONLY BOX FIX */
input,select{
width:100%;
padding:12px;
margin-bottom:10px;
border-radius:8px;
border:1px solid rgba(255,255,255,0.08);
background:var(--input-bg);
color:var(--text);
}

#addBtn{
width:100%;
padding:12px;
background:var(--primary);
color:white;
border:none;
border-radius:8px;
cursor:pointer;
}

.small-btn{
background:var(--neutral);
border:none;
padding:5px 10px;
margin-left:5px;
cursor:pointer;
}

li{
background:var(--item);
padding:12px;
margin-bottom:8px;
border-radius:8px;
display:flex;
justify-content:space-between;
}

.theme-toggle{
position:absolute;
top:10px;
right:10px;
border:none;
background:var(--neutral);
border-radius:50%;
width:32px;
height:32px;
cursor:pointer;
}

</style>
</head>

<body>

<div class="container">

<button id="themeToggle" class="theme-toggle">🌙</button>

<h2>Expense Tracker</h2>

<input id="amount" placeholder="Amount">
<select id="category">
<option>Food</option>
<option>Travel</option>
<option>Misc</option>
</select>

<input id="note" placeholder="Optional Note">

<button id="addBtn">Add</button>

<h3 id="grandTotal">Grand Total Rs 0</h3>

<ul id="expenseList"></ul>

</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script>

const firebaseConfig={
apiKey:"AIzaSyCCupf8EtI4Lk3bpNFgLs2B_-NsozHQS1g",
authDomain:"expense-tracker-2796a.firebaseapp.com",
databaseURL:"https://expense-tracker-2796a-default-rtdb.asia-southeast1.firebasedatabase.app",
projectId:"expense-tracker-2796a",
storageBucket:"expense-tracker-2796a.firebasestorage.app",
messagingSenderId:"246479741004",
appId:"1:246479741004:web:f486279bd9395547e114e9"
};

firebase.initializeApp(firebaseConfig);

const db=firebase.database();
const expensesRef=db.ref("expenses");

let expenses={};
let editingID=null;
let editingDate=null;

/* THEME */

themeToggle.onclick=()=>{
document.body.classList.toggle("dark");
};

/* 7AM LOGICAL DATE */

function getLogicalDate(){
const d=new Date();
d.setHours(d.getHours()-7);
return d.toISOString().split("T")[0];
}

expensesRef.on("value",(snapshot)=>{
expenses=snapshot.val()||{};
renderExpenses();
});

function renderExpenses(){

expenseList.innerHTML="";

let total=0;

Object.entries(expenses).forEach(([id,exp])=>{

total+=Number(exp.amount||0);

const li=document.createElement("li");

li.innerHTML=`Rs ${exp.amount} - ${exp.category||""} ${exp.note?"("+exp.note+")":""}`;

const editBtn=document.createElement("button");
editBtn.textContent="Edit";
editBtn.className="small-btn";

editBtn.onclick=()=>{
amount.value=exp.amount;
category.value=exp.category;
note.value=exp.note;

editingID=id;
editingDate=exp.date; // ⭐ preserve even if undefined
addBtn.textContent="Update";
};

const deleteBtn=document.createElement("button");
deleteBtn.textContent="Delete";
deleteBtn.className="small-btn";

deleteBtn.onclick=()=>{
if(confirm("Delete this expense?")){
expensesRef.child(id).remove();
}
};

const btns=document.createElement("div");
btns.appendChild(editBtn);
btns.appendChild(deleteBtn);

li.appendChild(btns);

expenseList.appendChild(li);

});

grandTotal.textContent="Grand Total Rs "+total;
}

addBtn.onclick=()=>{

const amountVal=amount.value;
if(!amountVal) return;

const data={
amount:amountVal,
category:category.value,
note:note.value
};

if(editingID){

// ⭐ KEEP ORIGINAL DATE (even undefined)
if(editingDate!==undefined){
data.date=editingDate;
}

expensesRef.child(editingID).set(data);

editingID=null;
editingDate=null;
addBtn.textContent="Add";

}else{

data.date=getLogicalDate();
expensesRef.push(data);

}

amount.value="";
note.value="";
};

</script>

</body>
</html>
