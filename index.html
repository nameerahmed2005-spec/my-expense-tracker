<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Expense Tracker</title>

<style>
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    padding: 20px;
    max-width: 500px;
    margin: auto;
    background: #fffbe6;
  }

  h2 { text-align: center; font-size: 28px; margin-bottom: 15px; }

  input, select, button {
    font-size: 18px;
    margin: 5px 0;
    padding: 12px;
    width: 100%;
    box-sizing: border-box;
    border-radius: 5px;
    border: 1px solid #ccc;
  }

  button {
    background-color: #4caf50;
    color: white;
    border: none;
    cursor: pointer;
  }

  button:hover { background-color: #45a049; }

  ul { list-style: none; padding-left: 0; margin-top: 20px; }

  li {
    background: linear-gradient(to bottom, #fffbe6 50%, #e0e0e0 50%);
    background-size: 100% 40px;
    padding: 10px;
    margin-bottom: 5px;
    font-size: 18px;
    border-radius: 5px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  h3 { font-size: 22px; margin-top: 20px; }

  .date-header {
    font-weight: bold;
    margin-top: 15px;
    font-size: 20px;
  }

  .small-btn {
    width: auto;
    padding: 6px 10px;
    margin-left: 6px;
    font-size: 14px;
  }
</style>
</head>

<body>

<h2>Expense Tracker</h2>

<input type="number" id="amount" placeholder="Amount" />

<select id="category">
  <option value="Food">Food</option>
  <option value="Travel">Travel</option>
  <option value="Misc">Misc</option>
</select>

<input type="text" id="note" placeholder="Optional Note" />

<button onclick="addExpense()" id="addBtn">Add</button>

<h3>Today's Total: Rs <span id="dailyTotal">0</span></h3>

<ul id="expenseList"></ul>

<script>

let expenses = JSON.parse(localStorage.getItem('expenses')) || [];
let today = new Date().toISOString().split('T')[0];
let editingIndex = -1;

function getDayString(dateStr) {
    const date = new Date(dateStr);
    const options = { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' };
    return date.toLocaleDateString(undefined, options);
}

function saveExpenses() {
    localStorage.setItem('expenses', JSON.stringify(expenses));
}

function renderExpenses() {

    const list = document.getElementById('expenseList');
    const dailyTotalEl = document.getElementById('dailyTotal');

    list.innerHTML = '';

    let dailyTotal = 0;
    let lastDate = '';

    expenses.forEach((exp, index) => {

        if(exp.date !== lastDate) {
            const dateHeader = document.createElement('li');
            dateHeader.textContent = getDayString(exp.date);
            dateHeader.className = 'date-header';
            list.appendChild(dateHeader);
            lastDate = exp.date;
        }

        const li = document.createElement('li');

        const text = document.createElement('span');
        text.textContent = `Rs ${exp.amount} - ${exp.category} ${exp.note ? '(' + exp.note + ')' : ''}`;

        // EDIT BUTTON
        const editBtn = document.createElement('button');
        editBtn.textContent = 'Edit';
        editBtn.className = 'small-btn';

        editBtn.onclick = () => {
            document.getElementById('amount').value = exp.amount;
            document.getElementById('category').value = exp.category;
            document.getElementById('note').value = exp.note;

            editingIndex = index;
            document.getElementById('addBtn').textContent = 'Update';
        };

        // DELETE BUTTON
        const deleteBtn = document.createElement('button');
        deleteBtn.textContent = 'Delete';
        deleteBtn.className = 'small-btn';

        deleteBtn.onclick = () => {
            if(confirm('Delete this expense?')) {
                expenses.splice(index, 1);
                saveExpenses();
                renderExpenses();
            }
        };

        const btnContainer = document.createElement('div');
        btnContainer.appendChild(editBtn);
        btnContainer.appendChild(deleteBtn);

        li.appendChild(text);
        li.appendChild(btnContainer);

        list.appendChild(li);

        if(exp.date === today) {
            dailyTotal += Number(exp.amount);
        }

    });

    dailyTotalEl.textContent = dailyTotal;
}

function addExpense() {

    const amount = document.getElementById('amount').value;
    const category = document.getElementById('category').value;
    const note = document.getElementById('note').value;

    if(!amount) return alert('Enter amount!');

    if(editingIndex === -1) {
        expenses.push({amount, category, note, date: today});
    } else {
        expenses[editingIndex].amount = amount;
        expenses[editingIndex].category = category;
        expenses[editingIndex].note = note;
        editingIndex = -1;
        document.getElementById('addBtn').textContent = 'Add';
    }

    saveExpenses();
    renderExpenses();

    document.getElementById('amount').value = '';
    document.getElementById('note').value = '';
}

function checkNewDay() {
    const current = new Date().toISOString().split('T')[0];
    if(current !== today) {
        today = current;
        renderExpenses();
    }
}

setInterval(checkNewDay, 60000);

renderExpenses();

</script>

</body>
</html>
