<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Expense Tracker</title>

<style>
body {
  font-family: 'Segoe UI', Arial, sans-serif;
  padding: 20px;
  max-width: 500px;
  margin: auto;
  background: #fffbe6;
}
h2 { text-align:center; font-size:28px; }
input,select,button{
  font-size:18px;
  margin:5px 0;
  padding:12px;
  width:100%;
  border-radius:5px;
}
button{ background:#4caf50;color:white;border:none; }
ul{ list-style:none;padding:0;margin-top:20px; }
li{
  background:linear-gradient(to bottom,#fffbe6 50%,#e0e0e0 50%);
  padding:10px;
  margin-bottom:5px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.small-btn{
  width:auto;
  padding:6px 10px;
  margin-left:6px;
  font-size:14px;
}
</style>

<!-- FIREBASE -->
<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
apiKey:"AIzaSyCCupf8EtI4Lk3bpNFgLs2B_-NsozHQS1g",
authDomain:"expense-tracker-2796a.firebaseapp.com",
projectId:"expense-tracker-2796a",
storageBucket:"expense-tracker-2796a.firebasestorage.app",
messagingSenderId:"246479741004",
appId:"1:246479741004:web:f486279bd9395547e114e9",
measurementId:"G-5JD5682WRH"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

window.db=db;
window.ref=ref;
window.set=set;
window.onValue=onValue;

</script>
</head>

<body>

<h2>Expense Tracker</h2>

<input type="number" id="amount" placeholder="Amount">
<select id="category">
<option>Food</option>
<option>Travel</option>
<option>Misc</option>
</select>
<input type="text" id="note" placeholder="Optional Note">
<button onclick="addExpense()" id="addBtn">Add</button>

<h3>Today's Total: Rs <span id="dailyTotal">0</span></h3>
<ul id="expenseList"></ul>

<script>

let expenses=[];
let editingIndex=-1;
let today=new Date().toISOString().split('T')[0];

const dbRef=ref(window.db,'expenses');

onValue(dbRef,(snapshot)=>{
  expenses=snapshot.val()||[];
  renderExpenses();
});

function saveExpenses(){
  set(dbRef,expenses);
}

function renderExpenses(){

const list=document.getElementById('expenseList');
list.innerHTML='';

let dailyTotal=0;

expenses.forEach((exp,index)=>{

const li=document.createElement('li');

const text=document.createElement('span');
text.textContent=`Rs ${exp.amount} - ${exp.category} ${exp.note? '('+exp.note+')':''}`;

const editBtn=document.createElement('button');
editBtn.textContent='Edit';
editBtn.className='small-btn';

editBtn.onclick=()=>{
amount.value=exp.amount;
category.value=exp.category;
note.value=exp.note;
editingIndex=index;
};

const deleteBtn=document.createElement('button');
deleteBtn.textContent='Delete';
deleteBtn.className='small-btn';

deleteBtn.onclick=()=>{
expenses.splice(index,1);
saveExpenses();
};

const btnDiv=document.createElement('div');
btnDiv.appendChild(editBtn);
btnDiv.appendChild(deleteBtn);

li.appendChild(text);
li.appendChild(btnDiv);
list.appendChild(li);

if(exp.date===today) dailyTotal+=Number(exp.amount);

});

dailyTotal.textContent=dailyTotal;
}

window.addExpense=function(){

const amount=document.getElementById('amount').value;
const category=document.getElementById('category').value;
const note=document.getElementById('note').value;

if(!amount) return;

if(editingIndex===-1){
expenses.push({amount,category,note,date:today});
}else{
expenses[editingIndex]={amount,category,note,date:today};
editingIndex=-1;
}

saveExpenses();

document.getElementById('amount').value='';
document.getElementById('note').value='';
}

</script>

</body>
</html>
