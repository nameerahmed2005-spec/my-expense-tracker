<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Expense Tracker</title>

<style>
body{
font-family:'Segoe UI',Arial;
padding:20px;
max-width:500px;
margin:auto;
background:#fffbe6;
}
input,select,button{
font-size:18px;
padding:12px;
margin:5px 0;
width:100%;
}
button{
background:#4caf50;
color:white;
border:none;
}
li{
display:flex;
justify-content:space-between;
margin-bottom:5px;
background:white;
padding:10px;
}
.small-btn{
width:auto;
padding:6px 10px;
margin-left:6px;
}
</style>

</head>

<body>

<h2>Expense Tracker</h2>

<input id="amount" type="number" placeholder="Amount">
<select id="category">
<option>Food</option>
<option>Travel</option>
<option>Misc</option>
</select>
<input id="note" placeholder="Optional Note">

<button id="addBtn">Add</button>

<h3>Total Rs <span id="dailyTotal">0</span></h3>

<ul id="expenseList"></ul>

<!-- FIREBASE NON-MODULE VERSION -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script>

const firebaseConfig={
apiKey:"AIzaSyCCupf8EtI4Lk3bpNFgLs2B_-NsozHQS1g",
authDomain:"expense-tracker-2796a.firebaseapp.com",
projectId:"expense-tracker-2796a",
storageBucket:"expense-tracker-2796a.firebasestorage.app",
messagingSenderId:"246479741004",
appId:"1:246479741004:web:f486279bd9395547e114e9"
};

firebase.initializeApp(firebaseConfig);

const db=firebase.database();
const expensesRef=db.ref("expenses");

let expenses={};
let editingID=null;

const addBtn=document.getElementById("addBtn");

expensesRef.on("value",(snapshot)=>{
expenses=snapshot.val()||{};
renderExpenses();
});

function renderExpenses(){

const list=document.getElementById("expenseList");
list.innerHTML="";
let total=0;

Object.entries(expenses).forEach(([id,exp])=>{

const li=document.createElement("li");

const text=document.createElement("span");
text.textContent=
`Rs ${exp.amount} - ${exp.category} ${exp.note? '('+exp.note+')':''}`;

const editBtn=document.createElement("button");
editBtn.textContent="Edit";
editBtn.className="small-btn";

editBtn.onclick=()=>{
document.getElementById("amount").value=exp.amount;
document.getElementById("category").value=exp.category;
document.getElementById("note").value=exp.note;
editingID=id;
addBtn.textContent="Update";
};

const deleteBtn=document.createElement("button");
deleteBtn.textContent="Delete";
deleteBtn.className="small-btn";

deleteBtn.onclick=()=>{
if(confirm("Delete this expense?")){
expensesRef.child(id).remove();
}
};

const btns=document.createElement("div");
btns.appendChild(editBtn);
btns.appendChild(deleteBtn);

li.appendChild(text);
li.appendChild(btns);
list.appendChild(li);

total+=Number(exp.amount);

});

document.getElementById("dailyTotal").textContent=total;
}

addBtn.onclick=()=>{

const amountVal=document.getElementById("amount").value;
const categoryVal=document.getElementById("category").value;
const noteVal=document.getElementById("note").value;

if(!amountVal) return;

if(editingID){

expensesRef.child(editingID).set({
amount:amountVal,
category:categoryVal,
note:noteVal
});

editingID=null;
addBtn.textContent="Add";

}else{

expensesRef.push({
amount:amountVal,
category:categoryVal,
note:noteVal
});
}

document.getElementById("amount").value="";
document.getElementById("note").value="";
};

</script>

</body>
</html>
