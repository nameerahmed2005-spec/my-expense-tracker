<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Expense Tracker</title>

<style>

/* LIGHT THEME */
:root{
--bg:#f6f7fb;
--card:#ffffff;
--text:#111;
--input-bg:#ffffff;
--border:#e5e7eb;
--item:#fafafa;
--primary:#22c55e;
--primary-hover:#16a34a;
--neutral:#e5e7eb;
}

/* DARK THEME */
.dark{
--bg:#0f1115;
--card:#1a1d24;
--text:#e6e6e6;
--input-bg:#12151b;
--border:#252a34;
--item:#151922;
--primary:#22c55e;
--primary-hover:#16a34a;
--neutral:#2c313c;
}

body{
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto;
background:var(--bg);
margin:0;
padding:20px;
display:flex;
justify-content:center;
color:var(--text);
transition:0.25s;
}

.container{
width:100%;
max-width:500px;
background:var(--card);
padding:25px;
border-radius:14px;
box-shadow:0 10px 25px rgba(0,0,0,0.08);
position:relative;
}

/* FIXED INPUT STYLE */

input,select{
width:100%;
padding:14px;
margin-bottom:12px;
border-radius:8px;
border:1px solid var(--border);
background:var(--input-bg);
color:var(--text);
font-size:16px;
outline:none;
box-shadow: inset 0 0 0 1px rgba(0,0,0,0.05);
}

input:focus,select:focus{
border-color:var(--primary);
box-shadow:0 0 0 2px rgba(34,197,94,0.2);
}

/* PRIMARY BUTTON */

#addBtn{
width:100%;
padding:14px;
background:var(--primary);
color:white;
border:none;
border-radius:8px;
font-size:17px;
cursor:pointer;
}

#addBtn:hover{
background:var(--primary-hover);
}

/* SMALL BUTTONS */

.small-btn{
width:auto;
padding:6px 12px;
margin-left:6px;
background:var(--neutral);
color:var(--text);
border:none;
border-radius:6px;
cursor:pointer;
}

ul{
list-style:none;
padding:0;
}

li{
background:var(--item);
padding:14px;
margin-bottom:10px;
border-radius:10px;
display:flex;
justify-content:space-between;
align-items:center;
border:1px solid var(--border);
}

.day-header{
font-weight:bold;
margin-top:20px;
margin-bottom:10px;
}

/* FLOATING THEME BUTTON */

.theme-toggle{
position:absolute;
top:15px;
right:15px;
width:38px;
height:38px;
border-radius:50%;
border:none;
background:var(--neutral);
color:var(--text);
cursor:pointer;
display:flex;
align-items:center;
justify-content:center;
font-size:18px;
}

</style>
</head>

<body>

<div class="container">

<button id="themeToggle" class="theme-toggle">🌙</button>

<h2>Expense Tracker</h2>

<input id="amount" type="number" placeholder="Amount">

<select id="category">
<option>Food</option>
<option>Travel</option>
<option>Misc</option>
</select>

<input id="note" placeholder="Optional Note">

<button id="addBtn">Add</button>

<h3 id="grandTotal">Grand Total Rs 0</h3>

<ul id="expenseList"></ul>

</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script>

const firebaseConfig={
apiKey:"AIzaSyCCupf8EtI4Lk3bpNFgLs2B_-NsozHQS1g",
authDomain:"expense-tracker-2796a.firebaseapp.com",
databaseURL:"https://expense-tracker-2796a-default-rtdb.asia-southeast1.firebasedatabase.app",
projectId:"expense-tracker-2796a",
storageBucket:"expense-tracker-2796a.firebasestorage.app",
messagingSenderId:"246479741004",
appId:"1:246479741004:web:f486279bd9395547e114e9"
};

firebase.initializeApp(firebaseConfig);

const db=firebase.database();
const expensesRef=db.ref("expenses");

let expenses={};
let editingID=null;

const addBtn=document.getElementById("addBtn");

/* THEME TOGGLE */

const themeBtn=document.getElementById("themeToggle");

function applyTheme(){
const saved=localStorage.getItem("theme");
if(saved==="dark"){
document.body.classList.add("dark");
themeBtn.textContent="☀️";
}
}

themeBtn.onclick=function(){
document.body.classList.toggle("dark");
const isDark=document.body.classList.contains("dark");
localStorage.setItem("theme",isDark?"dark":"light");
themeBtn.textContent=isDark?"☀️":"🌙";
};

applyTheme();

/* 7AM LOGICAL DAY */

function getLogicalDate(){
const d=new Date();
d.setHours(d.getHours()-7);
return d.toISOString().split("T")[0];
}

/* REALTIME SYNC */

expensesRef.on("value",(snapshot)=>{
expenses=snapshot.val()||{};
renderExpenses();
});

function renderExpenses(){

const list=document.getElementById("expenseList");
list.innerHTML="";

let grandTotal=0;
let grouped={};

Object.entries(expenses).forEach(([id,exp])=>{

const date=exp.date || "No Date";

if(!grouped[date]) grouped[date]=[];

grouped[date].push({id,...exp});

grandTotal+=Number(exp.amount||0);

});

document.getElementById("grandTotal").textContent=
"Grand Total Rs "+grandTotal;

Object.entries(grouped).sort().reverse().forEach(([day,entries])=>{

let dayTotal=0;
entries.forEach(e=>dayTotal+=Number(e.amount||0));

const header=document.createElement("div");
header.className="day-header";
header.textContent=`${day} — Daily Total Rs ${dayTotal}`;

list.appendChild(header);

entries.forEach(exp=>{

const li=document.createElement("li");

const text=document.createElement("span");
text.textContent=
`Rs ${exp.amount} - ${exp.category||''} ${exp.note?'('+exp.note+')':''}`;

const editBtn=document.createElement("button");
editBtn.textContent="Edit";
editBtn.className="small-btn";

editBtn.onclick=()=>{
document.getElementById("amount").value=exp.amount;
document.getElementById("category").value=exp.category;
document.getElementById("note").value=exp.note;
editingID=exp.id;
addBtn.textContent="Update";
};

const deleteBtn=document.createElement("button");
deleteBtn.textContent="Delete";
deleteBtn.className="small-btn";

deleteBtn.onclick=()=>{
if(confirm("Delete this expense?")){
expensesRef.child(exp.id).remove();
}
};

const btns=document.createElement("div");
btns.appendChild(editBtn);
btns.appendChild(deleteBtn);

li.appendChild(text);
li.appendChild(btns);

list.appendChild(li);

});

});

}

/* ⭐ EDIT DOES NOT CHANGE DATE */

addBtn.onclick=function(){

const amountVal=document.getElementById("amount").value;
const categoryVal=document.getElementById("category").value;
const noteVal=document.getElementById("note").value;

if(!amountVal) return;

if(editingID){

const originalDate = expenses[editingID].date;

expensesRef.child(editingID).set({
amount:amountVal,
category:categoryVal,
note:noteVal,
date:originalDate
});

editingID=null;
addBtn.textContent="Add";

}else{

expensesRef.push({
amount:amountVal,
category:categoryVal,
note:noteVal,
date:getLogicalDate()
});
}

document.getElementById("amount").value="";
document.getElementById("note").value="";
};

</script>

</body>
</html>
