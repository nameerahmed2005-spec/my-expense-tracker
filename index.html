<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Expense Tracker</title>

<style>

/* ===== INSANE UI RESTORED ===== */

:root{
--bg:#0f1115;
--card:#1a1d24;
--text:#e6e6e6;
--input-bg:#12151b;
--border:#2c313c;
--item:#151922;
--primary:#22c55e;
--neutral:#2c313c;
}

.light{
--bg:#f6f7fb;
--card:#ffffff;
--text:#111;
--input-bg:#ffffff;
--border:#e5e7eb;
--item:#fafafa;
--neutral:#e5e7eb;
}

body{
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto;
background:var(--bg);
margin:0;
padding:20px;
display:flex;
justify-content:center;
color:var(--text);
}

.container{
width:100%;
max-width:500px;
background:var(--card);
padding:25px;
border-radius:14px;
position:relative;
}

input,select{
width:100%;
padding:14px;
margin-bottom:12px;
border-radius:10px;
border:1px solid var(--border);
background:var(--input-bg);
color:var(--text);
font-size:16px;
}

/* ONLY WIDTH FIX */
#amount,#note{
box-sizing:border-box;
}

#addBtn{
width:100%;
padding:14px;
background:var(--primary);
color:white;
border:none;
border-radius:10px;
cursor:pointer;
}

.small-btn{
padding:6px 12px;
margin-left:6px;
background:var(--neutral);
border:none;
border-radius:8px;
cursor:pointer;
}

li{
background:var(--item);
padding:14px;
margin-bottom:10px;
border-radius:10px;
display:flex;
justify-content:space-between;
align-items:center;
border:1px solid var(--border);
}

.day-header{
font-weight:bold;
margin-top:20px;
margin-bottom:10px;
}

.theme-toggle{
position:absolute;
top:15px;
right:15px;
border:none;
background:var(--neutral);
border-radius:50%;
width:40px;
height:40px;
cursor:pointer;
font-size:18px;
}

</style>
</head>

<body>

<div class="container">

<button id="themeToggle" class="theme-toggle">🌙</button>

<h2>Expense Tracker</h2>

<input id="amount" type="number" placeholder="Amount">

<select id="category">
<option>Food</option>
<option>Travel</option>
<option>Misc</option>
</select>

<input id="note" placeholder="Optional Note">

<button id="addBtn">Add</button>

<h3 id="grandTotal">Grand Total Rs 0</h3>

<ul id="expenseList"></ul>

</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script>

const firebaseConfig={
apiKey:"AIzaSyCCupf8EtI4Lk3bpNFgLs2B_-NsozHQS1g",
authDomain:"expense-tracker-2796a.firebaseapp.com",
databaseURL:"https://expense-tracker-2796a-default-rtdb.asia-southeast1.firebasedatabase.app",
projectId:"expense-tracker-2796a"
};

firebase.initializeApp(firebaseConfig);

const db=firebase.database();
const expensesRef=db.ref("expenses");

let expenses={};
let editingID=null;
let editingDate=null;

const addBtn=document.getElementById("addBtn");
const themeBtn=document.getElementById("themeToggle");
const grandTotalEl=document.getElementById("grandTotal");

/* THEME FIX */

function applyTheme(){
if(localStorage.getItem("theme")==="light"){
document.body.classList.add("light");
themeBtn.textContent="☀️";
}else{
document.body.classList.remove("light");
themeBtn.textContent="🌙";
}
}

themeBtn.onclick=()=>{
if(document.body.classList.contains("light")){
localStorage.setItem("theme","dark");
}else{
localStorage.setItem("theme","light");
}
applyTheme();
};

applyTheme();

/* 7AM LOGICAL DATE */

function getLogicalDate(){
const d=new Date();
d.setHours(d.getHours()-7);
return d.toISOString().split("T")[0];
}

/* SYNC */

expensesRef.on("value",(snapshot)=>{
expenses=snapshot.val()||{};
renderExpenses();
});

function renderExpenses(){

expenseList.innerHTML="";

let grandTotal=0;
let grouped={};

Object.entries(expenses).forEach(([id,exp])=>{

const date=exp.date || "No Date";

if(!grouped[date]) grouped[date]=[];

grouped[date].push({id,...exp});

grandTotal+=Number(exp.amount||0);

});

grandTotalEl.textContent="Grand Total Rs "+grandTotal;

Object.entries(grouped).forEach(([day,entries])=>{

let dayTotal=0;
entries.forEach(e=>dayTotal+=Number(e.amount||0));

const header=document.createElement("div");
header.className="day-header";
header.textContent=`${day} — Daily Total Rs ${dayTotal}`;
expenseList.appendChild(header);

entries.forEach(exp=>{

const li=document.createElement("li");

const text=document.createElement("span");
text.textContent=`Rs ${exp.amount} - ${exp.category||''} ${exp.note?'('+exp.note+')':''}`;

const editBtn=document.createElement("button");
editBtn.textContent="Edit";
editBtn.className="small-btn";

editBtn.onclick=()=>{
amount.value=exp.amount;
category.value=exp.category;
note.value=exp.note;
editingID=exp.id;
editingDate=exp.date;
addBtn.textContent="Update";
};

const deleteBtn=document.createElement("button");
deleteBtn.textContent="Delete";
deleteBtn.className="small-btn";

deleteBtn.onclick=()=>{
if(confirm("Delete this expense?")){
expensesRef.child(exp.id).remove();
}
};

const btns=document.createElement("div");
btns.appendChild(editBtn);
btns.appendChild(deleteBtn);

li.appendChild(text);
li.appendChild(btns);

expenseList.appendChild(li);

});

});

}

/* ADD / UPDATE */

addBtn.onclick=()=>{

if(!amount.value) return;

const data={
amount:amount.value,
category:category.value,
note:note.value
};

if(editingID){

if(editingDate!==undefined) data.date=editingDate;

expensesRef.child(editingID).set(data);

editingID=null;
editingDate=null;
addBtn.textContent="Add";

}else{

data.date=getLogicalDate();
expensesRef.push(data);

}

amount.value="";
note.value="";
};

</script>

</body>
</html>
