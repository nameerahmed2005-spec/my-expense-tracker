<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Expense Tracker</title>

<style>

/* THEMES (UNCHANGED) */

:root{
--bg:#0b0f17;
--card:#171c26;
--text:#e6e6e6;
--input-bg:#0f1420;
--border:#242a36;
--item:#111827;
--primary:#22c55e;
--neutral:#2c313c;
}

body{
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto;
background:var(--bg);
margin:0;
padding:20px;
display:flex;
justify-content:center;
color:var(--text);
}

.container{
width:100%;
max-width:500px;
background:var(--card);
padding:25px;
border-radius:14px;
position:relative;
}

/* INPUTS (ORIGINAL LOOK) */

input,select{
width:100%;
padding:14px;
margin-bottom:12px;
border-radius:10px;
border:1px solid var(--border);
background:var(--input-bg);
color:var(--text);
font-size:16px;
outline:none;
}

/* ⭐ ONLY FIX — STOP OVERFLOW */
#amount,
#note{
box-sizing:border-box;
}

/* BUTTONS */

#addBtn{
width:100%;
padding:14px;
background:var(--primary);
color:white;
border:none;
border-radius:8px;
font-size:17px;
cursor:pointer;
}

.small-btn{
width:auto;
padding:6px 12px;
margin-left:6px;
background:var(--neutral);
color:var(--text);
border:none;
border-radius:6px;
cursor:pointer;
}

ul{
list-style:none;
padding:0;
}

li{
background:var(--item);
padding:14px;
margin-bottom:10px;
border-radius:10px;
display:flex;
justify-content:space-between;
align-items:center;
border:1px solid var(--border);
}

.day-header{
font-weight:bold;
margin-top:20px;
margin-bottom:10px;
}

/* THEME BUTTON (UNCHANGED) */

.theme-toggle{
position:absolute;
top:15px;
right:15px;
width:36px;
height:36px;
border-radius:50%;
border:none;
background:var(--neutral);
cursor:pointer;
}

</style>
</head>

<body>

<div class="container">

<button id="themeToggle" class="theme-toggle">🌙</button>

<h2>Expense Tracker</h2>

<input id="amount" type="number" placeholder="Amount">

<select id="category">
<option>Food</option>
<option>Travel</option>
<option>Misc</option>
</select>

<input id="note" placeholder="Optional Note">

<button id="addBtn">Add</button>

<h3 id="grandTotal">Grand Total Rs 0</h3>

<ul id="expenseList"></ul>

</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script>

/* FIREBASE CONFIG (UNCHANGED) */

const firebaseConfig={
apiKey:"AIzaSyCCupf8EtI4Lk3bpNFgLs2B_-NsozHQS1g",
authDomain:"expense-tracker-2796a.firebaseapp.com",
databaseURL:"https://expense-tracker-2796a-default-rtdb.asia-southeast1.firebasedatabase.app",
projectId:"expense-tracker-2796a",
storageBucket:"expense-tracker-2796a.firebasestorage.app",
messagingSenderId:"246479741004",
appId:"1:246479741004:web:f486279bd9395547e114e9"
};

firebase.initializeApp(firebaseConfig);

const db=firebase.database();
const expensesRef=db.ref("expenses");

let expenses={};
let editingID=null;
let editingDate=null;

const addBtn=document.getElementById("addBtn");

/* THEME TOGGLE */

const themeBtn=document.getElementById("themeToggle");

themeBtn.onclick=function(){
document.body.classList.toggle("dark");
};

/* 7AM LOGICAL DATE */

function getLogicalDate(){
const d=new Date();
d.setHours(d.getHours()-7);
return d.toISOString().split("T")[0];
}

/* REALTIME SYNC */

expensesRef.on("value",(snapshot)=>{
expenses=snapshot.val()||{};
renderExpenses();
});

function renderExpenses(){

const list=document.getElementById("expenseList");
list.innerHTML="";

let total=0;

Object.entries(expenses).forEach(([id,exp])=>{

total+=Number(exp.amount||0);

const li=document.createElement("li");

const text=document.createElement("span");
text.textContent=
`Rs ${exp.amount} - ${exp.category||''} ${exp.note?'('+exp.note+')':''}`;

const editBtn=document.createElement("button");
editBtn.textContent="Edit";
editBtn.className="small-btn";

editBtn.onclick=()=>{
amount.value=exp.amount;
category.value=exp.category;
note.value=exp.note;

editingID=id;
editingDate=exp.date;

addBtn.textContent="Update";
};

const deleteBtn=document.createElement("button");
deleteBtn.textContent="Delete";
deleteBtn.className="small-btn";

deleteBtn.onclick=()=>{
if(confirm("Delete this expense?")){
expensesRef.child(id).remove();
}
};

const btns=document.createElement("div");
btns.appendChild(editBtn);
btns.appendChild(deleteBtn);

li.appendChild(text);
li.appendChild(btns);

list.appendChild(li);

});

grandTotal.textContent="Grand Total Rs "+total;
}

/* ADD / UPDATE */

addBtn.onclick=function(){

const amountVal=amount.value;
const categoryVal=category.value;
const noteVal=note.value;

if(!amountVal) return;

if(editingID){

const data={
amount:amountVal,
category:categoryVal,
note:noteVal
};

if(editingDate!==undefined){
data.date=editingDate;
}

expensesRef.child(editingID).set(data);

editingID=null;
editingDate=null;
addBtn.textContent="Add";

}else{

expensesRef.push({
amount:amountVal,
category:categoryVal,
note:noteVal,
date:getLogicalDate()
});
}

amount.value="";
note.value="";
};

</script>

</body>
</html>
