<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Expense Tracker</title>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

/* ===== PASTE YOUR FIREBASE CONFIG BELOW ===== */

const firebaseConfig = {
    apiKey: "AIzaSyCCupf8EtI4Lk3bpNFgLs2B_-NsozHQS1g",
    authDomain: "expense-tracker-2796a.firebaseapp.com",
    projectId: "expense-tracker-2796a",
    storageBucket: "expense-tracker-2796a.firebasestorage.app",
    messagingSenderId: "246479741004",
    appId: "1:246479741004:web:f486279bd9395547e114e9",
    measurementId: "G-5JD5682WRH"
  };;

/* ============================================ */

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

window.db = db;
window.ref = ref;
window.set = set;
window.onValue = onValue;

</script>

<style>
body { font-family: Arial; padding:20px; max-width:500px; margin:auto; }
li { display:flex; justify-content:space-between; margin-bottom:5px; }
.small-btn { width:auto; padding:5px; margin-left:5px; }
</style>

</head>

<body>

<h2>Expense Tracker</h2>

<input type="number" id="amount" placeholder="Amount">
<select id="category">
<option>Food</option>
<option>Travel</option>
<option>Misc</option>
</select>

<input type="text" id="note" placeholder="Note">
<button onclick="addExpense()" id="addBtn">Add</button>

<h3>Total: Rs <span id="dailyTotal">0</span></h3>

<ul id="expenseList"></ul>

<script>

let expenses = [];
let editingIndex = -1;
let today = new Date().toISOString().split('T')[0];

const dbRef = ref(window.db,'expenses');

/* ===== REALTIME SYNC ===== */

onValue(dbRef,(snapshot)=>{
    const data = snapshot.val();
    expenses = data || [];
    renderExpenses();
});

/* ===== SAVE TO CLOUD ===== */

function saveExpenses(){
    set(dbRef,expenses);
}

function renderExpenses(){

    const list=document.getElementById('expenseList');
    list.innerHTML='';

    let total=0;

    expenses.forEach((exp,index)=>{

        const li=document.createElement('li');

        const text=document.createElement('span');
        text.textContent=`Rs ${exp.amount} - ${exp.category}`;

        const editBtn=document.createElement('button');
        editBtn.textContent='Edit';
        editBtn.className='small-btn';

        editBtn.onclick=()=>{
            amount.value=exp.amount;
            category.value=exp.category;
            note.value=exp.note;
            editingIndex=index;
        };

        const deleteBtn=document.createElement('button');
        deleteBtn.textContent='Delete';
        deleteBtn.className='small-btn';

        deleteBtn.onclick=()=>{
            expenses.splice(index,1);
            saveExpenses();
        };

        const btnDiv=document.createElement('div');
        btnDiv.appendChild(editBtn);
        btnDiv.appendChild(deleteBtn);

        li.appendChild(text);
        li.appendChild(btnDiv);

        list.appendChild(li);

        if(exp.date===today) total+=Number(exp.amount);
    });

    dailyTotal.textContent=total;
}

window.addExpense=function(){

    const amount=document.getElementById('amount').value;
    const category=document.getElementById('category').value;
    const note=document.getElementById('note').value;

    if(!amount) return;

    if(editingIndex===-1){
        expenses.push({amount,category,note,date:today});
    }else{
        expenses[editingIndex]={amount,category,note,date:today};
        editingIndex=-1;
    }

    saveExpenses();

    document.getElementById('amount').value='';
    document.getElementById('note').value='';
}

</script>

</body>
</html>
