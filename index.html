<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Expense Tracker</title>

<style>

/* LIGHT */
:root{
--bg:#f6f7fb;
--card:#ffffff;
--text:#111;
--input-bg:#f9fafb;
--border:#e5e7eb;
--item:#fafafa;
--primary:#22c55e;
--primary-hover:#16a34a;
--neutral:#e5e7eb;
}

/* DARK */
.dark{
--bg:#0f1115;
--card:#1a1d24;
--text:#e6e6e6;
--input-bg:#171b22;
--border:#222733;
--item:#151922;
--primary:#22c55e;
--primary-hover:#16a34a;
--neutral:#2c313c;
}

body{
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto;
background:var(--bg);
margin:0;
padding:20px;
display:flex;
justify-content:center;
color:var(--text);
}

.container{
width:100%;
max-width:500px;
background:var(--card);
padding:25px;
border-radius:14px;
position:relative;
}

/* INPUTS FIXED */
input,select{
width:100%;
padding:14px;
margin-bottom:12px;
border-radius:10px;

/* ⭐ softer border */
border:1px solid rgba(255,255,255,0.06);

background:var(--input-bg);
color:var(--text);
font-size:16px;
outline:none;
box-shadow: inset 0 1px 2px rgba(0,0,0,0.2);
}

input:focus,select:focus{
border-color:var(--primary);
}

#addBtn{
width:100%;
padding:14px;
background:var(--primary);
color:white;
border:none;
border-radius:8px;
cursor:pointer;
}

.small-btn{
width:auto;
padding:6px 12px;
margin-left:6px;
background:var(--neutral);
color:var(--text);
border:none;
border-radius:6px;
cursor:pointer;
}

li{
background:var(--item);
padding:14px;
margin-bottom:10px;
border-radius:10px;
display:flex;
justify-content:space-between;
align-items:center;
border:1px solid var(--border);
}

.theme-toggle{
position:absolute;
top:15px;
right:15px;
width:36px;
height:36px;
border-radius:50%;
border:none;
background:var(--neutral);
cursor:pointer;
}

</style>
</head>

<body>

<div class="container">

<button id="themeToggle" class="theme-toggle">🌙</button>

<h2>Expense Tracker</h2>

<input id="amount" type="number" placeholder="Amount">

<select id="category">
<option>Food</option>
<option>Travel</option>
<option>Misc</option>
</select>

<input id="note" placeholder="Optional Note">

<button id="addBtn">Add</button>

<h3 id="grandTotal">Grand Total Rs 0</h3>

<ul id="expenseList"></ul>

</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script>

/* FIREBASE */

const firebaseConfig={
apiKey:"AIzaSyCCupf8EtI4Lk3bpNFgLs2B_-NsozHQS1g",
authDomain:"expense-tracker-2796a.firebaseapp.com",
databaseURL:"https://expense-tracker-2796a-default-rtdb.asia-southeast1.firebasedatabase.app",
projectId:"expense-tracker-2796a",
storageBucket:"expense-tracker-2796a.firebasestorage.app",
messagingSenderId:"246479741004",
appId:"1:246479741004:web:f486279bd9395547e114e9"
};

firebase.initializeApp(firebaseConfig);

const db=firebase.database();
const expensesRef=db.ref("expenses");

/* STATE */

let expenses={};
let editingID=null;
let editingDate=null;

/* THEME */

const themeBtn=document.getElementById("themeToggle");

function applyTheme(){
if(localStorage.getItem("theme")==="dark"){
document.body.classList.add("dark");
themeBtn.textContent="☀️";
}
}

themeBtn.onclick=()=>{
document.body.classList.toggle("dark");
const dark=document.body.classList.contains("dark");
localStorage.setItem("theme",dark?"dark":"light");
themeBtn.textContent=dark?"☀️":"🌙";
};

applyTheme();

/* LOGICAL DAY (7AM) */

function getLogicalDate(){
const d=new Date();
d.setHours(d.getHours()-7);
return d.toISOString().split("T")[0];
}

/* REALTIME SYNC */

expensesRef.on("value",(snapshot)=>{
expenses=snapshot.val()||{};
renderExpenses();
});

/* RENDER */

function renderExpenses(){

const list=document.getElementById("expenseList");
list.innerHTML="";

let total=0;

Object.entries(expenses).forEach(([id,exp])=>{

total+=Number(exp.amount||0);

const li=document.createElement("li");

const text=document.createElement("span");
text.textContent=`Rs ${exp.amount} - ${exp.category||''} ${exp.note?'('+exp.note+')':''}`;

const editBtn=document.createElement("button");
editBtn.textContent="Edit";
editBtn.className="small-btn";

editBtn.onclick=()=>{
amount.value=exp.amount;
category.value=exp.category;
note.value=exp.note;

editingID=id;
editingDate=exp.date; // ⭐ preserve original (even if undefined)

addBtn.textContent="Update";
};

const deleteBtn=document.createElement("button");
deleteBtn.textContent="Delete";
deleteBtn.className="small-btn";

deleteBtn.onclick=()=>{
if(confirm("Delete this expense?")){
expensesRef.child(id).remove();
}
};

const btns=document.createElement("div");
btns.appendChild(editBtn);
btns.appendChild(deleteBtn);

li.appendChild(text);
li.appendChild(btns);

list.appendChild(li);

});

grandTotal.textContent="Grand Total Rs "+total;
}

/* ADD / UPDATE */

addBtn.onclick=()=>{

const amountVal=amount.value;
const categoryVal=category.value;
const noteVal=note.value;

if(!amountVal) return;

if(editingID){

// ⭐ DO NOT change date
const updatedData={
amount:amountVal,
category:categoryVal,
note:noteVal
};

if(editingDate !== undefined){
updatedData.date=editingDate;
}

expensesRef.child(editingID).set(updatedData);

editingID=null;
editingDate=null;
addBtn.textContent="Add";

}else{

expensesRef.push({
amount:amountVal,
category:categoryVal,
note:noteVal,
date:getLogicalDate()
});

}

amount.value="";
note.value="";

};

</script>

</body>
</html>
