<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Expense Tracker</title>

<style>

/* ============================= */
/* PREMIUM DARK GLASS UI (RESTORED) */
/* ============================= */

:root{
--bg1:#0b1220;
--bg2:#070a12;
--bg3:#05070d;

--card1:#161a24;
--card2:#0e1118;

--text:#e6e6e6;
--border:#1c2433;
--primary:#22c55e;
}

/* Background */
body{
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto;
margin:0;
padding:20px;
display:flex;
justify-content:center;
color:var(--text);

background:
radial-gradient(circle at top, var(--bg1) 0%, var(--bg2) 60%, var(--bg3) 100%);
}

/* Main Card */
.container{

width:100%;
max-width:500px;
padding:25px;

border-radius:18px;

background:
linear-gradient(145deg, rgba(22,26,36,0.9), rgba(14,17,24,0.9));

box-shadow:
0 20px 50px rgba(0,0,0,0.6),
inset 0 1px 0 rgba(255,255,255,0.03);

backdrop-filter: blur(14px);

position:relative;
}

/* DO NOT TOUCH amount + note inputs */
/* only general styles */

input,select{

width:100%;
box-sizing:border-box;   /* ⭐ THIS FIXES OVERFLOW */

padding:14px;
margin-bottom:12px;
border-radius:12px;

background:#0b0f17;
color:var(--text);

font-size:16px;
}


/* Dropdown style (NOT amount/note) */
select{
border:1px solid var(--border);

box-shadow:
inset 0 3px 8px rgba(0,0,0,0.6);
}

/* Add Button */
#addBtn{

width:100%;
padding:14px;

background:var(--primary);
color:white;

border:none;
border-radius:14px;

cursor:pointer;
}

/* Expense Item Cards */
li{

background:
linear-gradient(145deg,#0f1420,#0c1019);

padding:14px;
margin-bottom:12px;

border-radius:14px;

display:flex;
justify-content:space-between;
align-items:flex-start;

border:1px solid #141a26;

box-shadow:
0 8px 20px rgba(0,0,0,0.5),
inset 0 1px 0 rgba(255,255,255,0.02);
}

/* Small buttons */
.small-btn{

padding:6px 12px;
margin-left:6px;

background:#2c313c;
border:none;

border-radius:8px;
cursor:pointer;
}

/* Theme Toggle */
.theme-toggle{

position:absolute;
top:15px;
right:15px;

border:none;

background:
linear-gradient(145deg,#1c2230,#141a26);

border-radius:50%;

width:40px;
height:40px;

cursor:pointer;

box-shadow:
0 6px 15px rgba(0,0,0,0.6),
inset 0 1px 0 rgba(255,255,255,0.05);
}

/* LIGHT MODE */

body.light{

background:
radial-gradient(circle at top,#f3f4f8 0%,#e8ebf1 60%,#dde1e8 100%);

color:#111;
}

body.light .container{
background:
linear-gradient(145deg,#ffffff,#f4f6fb);

box-shadow:
0 20px 50px rgba(0,0,0,0.08),
inset 0 1px 0 rgba(255,255,255,0.8);
}

body.light input,
body.light select{
background:#ffffff;
color:#111;
border:1px solid #ddd;
}

body.light li{
background:#f7f8fb;
border:1px solid #e5e7eb;
}

body.light .theme-toggle{
background:#f1f5f9;
}

/* WHITE BUTTON TEXT */
.small-btn{
color:white;
}

.day-header{
text-align:left;
width:100%;
margin:10px 0 6px 0;
}

li span{
text-align:left;
display:block;
}

#expenseList{
list-style:none;
padding-left:0;
margin:0;
}

.day-header{
cursor:pointer;
}

/* ===== PRO DRAG FEEDBACK ===== */

.dragging{
opacity:0.5;
}

.drop-success{
animation:dropFlash 0.4s ease;
}

@keyframes dropFlash{
0%{ box-shadow:0 0 0px transparent;}
50%{ box-shadow:0 0 15px var(--primary);}
100%{ box-shadow:0 0 0px transparent;}
}

li{
transition:transform 0.15s ease, box-shadow 0.15s ease;
}

li:hover{
transform:translateY(-2px);
}

/* ===== GHOST DRAG PREVIEW ===== */

.drag-ghost{
position:fixed;
pointer-events:none;
z-index:9999;

background:linear-gradient(145deg,#0f1420,#0c1019);
border:1px solid #141a26;
border-radius:14px;

padding:14px;

opacity:0.85;
transform:scale(0.95);

box-shadow:0 10px 30px rgba(0,0,0,0.7);
}

.drop-target{
outline:2px solid var(--primary);
border-radius:10px;
transform:scale(1.01);
transform-origin:center;
will-change:transform;
transition:transform 0.12s ease;
}

li{
    touch-action:none;
}

#loginOverlay{
transition:opacity 0.35s ease;
}

#userAvatar:hover{
transform:scale(1.05);
transition:0.2s;
}

#loadingScreen{
transition:opacity 0.3s ease;
}

</style>

</head>

<body>

<div id="loadingScreen" style="
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:#05070d;
display:flex;
align-items:center;
justify-content:center;
z-index:10000;
color:white;
font-size:18px;
">
Loading...
</div>

<!-- FULL SCREEN LOGIN OVERLAY -->
<div id="loginOverlay" style="
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
display:none;
align-items:center;
justify-content:center;
background:radial-gradient(circle at top,#0b1220 0%,#070a12 60%,#05070d 100%);
z-index:9999;
">

<div style="
background:linear-gradient(145deg,#161a24,#0e1118);
padding:40px;
border-radius:20px;
box-shadow:0 20px 50px rgba(0,0,0,0.6);
text-align:center;
">

<h2 style="margin-top:0;">Expense Tracker</h2>
<p style="opacity:0.7;">Login to continue</p>

<button id="overlayLoginBtn" class="small-btn" style="margin-top:15px;">
Login with Google
</button>

</div>
</div>

<div class="container" id="appContainer" style="display:none;">

<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">

    <div style="display:flex; align-items:center; gap:12px;">
        <img id="userAvatar" style="
        display:none;
        width:40px;
        height:40px;
        border-radius:50%;
        cursor:pointer;
        ">
        <h2 style="margin:0;">Expense Tracker</h2>
    </div>

    <button id="themeToggle" class="theme-toggle" style="position:static;">
        🌙
    </button>

</div>

<div id="userMenu" style="
display:none;
position:absolute;
top:60px;
left:20px;
background:#161a24;
border-radius:12px;
padding:10px;
min-width:150px;
box-shadow:0 10px 30px rgba(0,0,0,0.5);
">
    <div id="userName" style="margin-bottom:10px;opacity:0.7;"></div>
    <button id="logoutBtn" class="small-btn">Logout</button>
</div>

<input id="amount" type="number" placeholder="Amount">

<select id="category">
<option>Food</option>
<option>Travel</option>
<option>Misc</option>
</select>

<input id="note" placeholder="Optional Note">

<button id="addBtn">Add</button>

<h3 id="grandTotal">Grand Total Rs 0</h3>

<ul id="expenseList"></ul>

</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<script>

const firebaseConfig={
apiKey:"AIzaSyCCupf8EtI4Lk3bpNFgLs2B_-NsozHQS1g",
authDomain:"expense-tracker-2796a.firebaseapp.com",
databaseURL:"https://expense-tracker-2796a-default-rtdb.asia-southeast1.firebasedatabase.app",
projectId:"expense-tracker-2796a"
};

firebase.initializeApp(firebaseConfig);

const db = firebase.database();
const auth = firebase.auth();

// VERY IMPORTANT for mobile redirect login
firebase.auth().useDeviceLanguage();

auth.getRedirectResult()
.then((result) => {
    if (result.user) {
        console.log("Redirect login successful");
    }
})
.catch((error) => {
    console.error("Redirect login error:", error);
});

auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL)
.then(() => {
    console.log("Auth persistence ready");
})
.catch((err) => {
    console.error("Persistence error:", err);
});

let expensesRef = null;
let expensesListener = null;
let authResolved = false;
let authChecked = false;
let loginTimeout = null;

const provider = new firebase.auth.GoogleAuthProvider();

const overlayLoginBtn = document.getElementById("overlayLoginBtn");
const loginOverlay = document.getElementById("loginOverlay");
const appContainer = document.getElementById("appContainer");
const logoutBtn = document.getElementById("logoutBtn");
const userAvatar = document.getElementById("userAvatar");
const userMenu = document.getElementById("userMenu");
const userName = document.getElementById("userName");
const loadingScreen = document.getElementById("loadingScreen");

provider.setCustomParameters({
prompt: "select_account"
});
    
function startLogin() {

    auth.signInWithPopup(provider)
    .catch(error => {

        console.log("Popup failed, switching to redirect...", error);

        // fallback for mobile or popup-blocked browsers
        auth.signInWithRedirect(provider);

    });

}

overlayLoginBtn.onclick = startLogin;

logoutBtn.onclick = () => {
    auth.signOut();
};

auth.onAuthStateChanged((user) => {
    authChecked = true;
    // FIRST TIME ONLY — auth fully resolved
    if (!authResolved) {

        authResolved = true;

        // hide loading ONLY AFTER auth known
        loadingScreen.style.display = "none";
    }

    if (user) {
        clearTimeout(loginTimeout);

        loginOverlay.style.display = "none";
        appContainer.style.display = "block";

        logoutBtn.style.display = "block";
        userAvatar.style.display = "block";

        userAvatar.src = user.photoURL
            ? user.photoURL
            : "https://ui-avatars.com/api/?name=" +
              encodeURIComponent(user.displayName || "User");

        userName.textContent = user.displayName || "User";

        const uid = user.uid;

        expensesRef = db.ref("expenses/" + uid);

        if (expensesListener) {
            expensesRef.off("value", expensesListener);
        }

        expensesListener = (snapshot) => {
            expenses = snapshot.val() || {};
            renderExpenses();
        };

        expensesRef.on("value", expensesListener);

    } else {

    appContainer.style.display = "none";

    userAvatar.style.display = "none";
    userMenu.style.display = "none";

    expenses = {};
    renderExpenses();

    // ⭐ Delay showing login screen to prevent flash
    clearTimeout(loginTimeout);

    loginTimeout = setTimeout(() => {
        loginOverlay.style.display = "flex";
    }, 400); // adjust between 300-500ms if needed
}

});
    
let expenses={};
let editingID=null;
let editingDate=null;
let ghost = null;
let touchDraggingID = null;

/* MOBILE DETECTION */
const isTouchDevice = 'ontouchstart' in window;

const addBtn=document.getElementById("addBtn");
const themeBtn=document.getElementById("themeToggle");
const grandTotalEl=document.getElementById("grandTotal");

/* THEME */

function applyTheme(){
if(localStorage.getItem("theme")==="light"){
document.body.classList.add("light");
themeBtn.textContent="🌙";
}else{
document.body.classList.remove("light");
themeBtn.textContent="☀️";
}
}

themeBtn.onclick=()=>{
localStorage.setItem(
"theme",
document.body.classList.contains("light") ? "dark":"light"
);
applyTheme();
};

if(!localStorage.getItem("theme")){
localStorage.setItem("theme","dark");
}
applyTheme();

/* 7AM LOGICAL DATE */

function getLogicalDate(){

    const now = new Date();

    const local = new Date(
        now.getTime() - now.getTimezoneOffset() * 60000
    );

    return local.toISOString().split("T")[0];
}

function formatDate(dateStr){

    if(dateStr==="No Date") return "No Date";

    const date = new Date(dateStr);

    const day = String(date.getDate()).padStart(2,"0");

    const months = [
        "Jan","Feb","Mar","Apr","May","Jun",
        "Jul","Aug","Sep","Oct","Nov","Dec"
    ];

    const monthName = months[date.getMonth()];

    const year = date.getFullYear();

    return `${day}-${monthName}-${year}`;
}

function generateFullDateRange(grouped){

    const today = new Date();
    today.setHours(0,0,0,0);
    const start = new Date(today.getFullYear(), today.getMonth(), 1); // first day of month
    const end = new Date(today.getFullYear(), today.getMonth(), today.getDate()); // today

    let current = new Date(start);
    current.setHours(0,0,0,0);

    while(current <= end){

        const key = new Date(current.getTime() - current.getTimezoneOffset() * 60000).toISOString().split("T")[0];

        if(!grouped[key]) grouped[key] = [];

        current.setDate(current.getDate()+1);
    }

    return grouped;
}

function renderExpenses(){
const expenseList = document.getElementById("expenseList");
expenseList.innerHTML="";

let grandTotal=0;
let grouped={};

Object.entries(expenses).forEach(([id,exp])=>{

const date=exp.date||"No Date";

if(!grouped[date]) grouped[date]=[];

grouped[date].push({id,...exp});

grandTotal+=Number(exp.amount||0);

});

grouped=generateFullDateRange(grouped);

grandTotalEl.textContent="Grand Total Rs "+grandTotal;

Object.entries(grouped)
.sort((a,b)=>{

    if(a[0]==="No Date") return 1;
    if(b[0]==="No Date") return -1;

    return new Date(b[0]) - new Date(a[0]); // newest first

})
.forEach(([day,entries])=>{

/* ===== FULL DAY CONTAINER (PRO DROP ZONE) ===== */

const dayContainer=document.createElement("div");
dayContainer.dataset.day = day;

dayContainer.addEventListener("dragenter",(e)=>{
    e.preventDefault();   // allow drop
    dayContainer.classList.add("drop-target");
});

dayContainer.addEventListener("dragover",(e)=>{
    e.preventDefault();
});

dayContainer.addEventListener("dragleave",(e)=>{

    // Only remove highlight if actually leaving container,
    // not just entering a child element

    if(!dayContainer.contains(e.relatedTarget)){
        dayContainer.classList.remove("drop-target");
    }

});

dayContainer.addEventListener("drop",(e)=>{

e.preventDefault();

const draggedID=e.dataTransfer.getData("text/plain");

const item=expenses[draggedID];

if(!item) return;

item.date=day;

expensesRef.child(draggedID).set(item);

dayContainer.classList.remove("drop-target");
dayContainer.classList.add("drop-success");

setTimeout(()=>{
dayContainer.classList.remove("drop-success");
},400);

});

/* HEADER */

let dayTotal=0;
entries.forEach(e=>dayTotal+=Number(e.amount||0));

const header=document.createElement("div");
header.className="day-header";
header.textContent=`${formatDate(day)} — Daily Total Rs ${dayTotal}`;

dayContainer.appendChild(header);

/* ENTRIES */

entries.forEach(exp=>{

const li=document.createElement("li");

li.draggable=true;

/* ===== MOBILE TOUCH DRAG ===== */

li.addEventListener("touchstart",(e)=>{

    if(!isTouchDevice) return;

    const touch = e.touches[0];

    touchDraggingID = exp.id;

    li.classList.add("dragging");

    if(ghost){
        ghost.remove();
        ghost=null;
    }

    ghost = li.cloneNode(true);
    ghost.classList.add("drag-ghost");

    ghost.style.left = (touch.clientX + 10) + "px";
    ghost.style.top  = (touch.clientY + 10) + "px";

    document.body.appendChild(ghost);
});

li.addEventListener("dragstart",(e)=>{

if(ghost){
ghost.remove();
ghost=null;
}

li.classList.add("dragging");

e.dataTransfer.setData("text/plain",exp.id);

/* CREATE GHOST */
ghost = li.cloneNode(true);
ghost.classList.add("drag-ghost");
document.body.appendChild(ghost);

/* hide default preview */
if(!isTouchDevice){
   e.dataTransfer.setDragImage(new Image(),0,0);
}

});

li.addEventListener("dragend",()=>{

li.classList.remove("dragging");

if(ghost){
ghost.remove();
ghost=null;
}

});

const text=document.createElement("span");
text.textContent=`Rs ${exp.amount} - ${exp.category||''} ${exp.note?'('+exp.note+')':''}`;

const editBtn=document.createElement("button");
editBtn.textContent="Edit";
editBtn.className="small-btn";

const deleteBtn=document.createElement("button");
deleteBtn.textContent="Delete";
deleteBtn.className="small-btn";

/* prevent drag when clicking buttons */
editBtn.addEventListener("mousedown",e=>e.stopPropagation());
deleteBtn.addEventListener("mousedown",e=>e.stopPropagation());

editBtn.onclick=()=>{
amount.value=exp.amount;
category.value=exp.category;
note.value=exp.note;
editingID=exp.id;
editingDate=exp.date;
addBtn.textContent="Update";
};

deleteBtn.onclick=()=>{
if(confirm("Delete this expense?")){
expensesRef.child(exp.id).remove();
}
};

const btns=document.createElement("div");
btns.appendChild(editBtn);
btns.appendChild(deleteBtn);

li.appendChild(text);
li.appendChild(btns);

dayContainer.appendChild(li);

});

expenseList.appendChild(dayContainer);

});

}

/* ADD / UPDATE */

addBtn.onclick=()=>{

if(!expensesRef){
alert("Please login first");
return;
}

if(!amount.value) return;

const data={
amount:amount.value,
category:category.value,
note:note.value
};

if(editingID){

if(editingDate!==undefined) data.date=editingDate;

expensesRef.child(editingID).set(data);

editingID=null;
editingDate=null;
addBtn.textContent="Add";

}else{

data.date=getLogicalDate();
expensesRef.push(data);

}

amount.value="";
note.value="";
};

/* AUTO SCROLL WHILE DRAGGING */

document.addEventListener("touchmove",(e)=>{

    if(!touchDraggingID || !ghost) return;

    e.preventDefault();

    const touch = e.touches[0];

    /* AUTO SCROLL (mobile native feel) */

    const margin = 80;

    if(touch.clientY < margin){
        window.scrollBy(0,-8);
    }
    else if(window.innerHeight - touch.clientY < margin){
        window.scrollBy(0,8);
    }

    ghost.style.left = (touch.clientX + 10) + "px";
    ghost.style.top  = (touch.clientY + 10) + "px";

    /* LIVE HIGHLIGHT TARGET */

    document.querySelectorAll("[data-day]").forEach(el=>{
        el.classList.remove("drop-target");
    });

    const el = document.elementFromPoint(touch.clientX, touch.clientY);
    const target = el?.closest("[data-day]");

    if(target){
        target.classList.add("drop-target");
    }

},{ passive:false });

/* MOBILE SAFETY CLEANUP */

document.addEventListener("touchend",(e)=>{

    if(!touchDraggingID) return;

    const touch = e.changedTouches[0];
    const el = document.elementFromPoint(touch.clientX, touch.clientY);

    const dayContainer = el?.closest("[data-day]");

    if(dayContainer){

        const day = dayContainer.dataset.day;
        const item = expenses[touchDraggingID];

        if(item){
            item.date = day;
            expensesRef.child(touchDraggingID).set(item);
        }
    }

    /* cleanup */

    const dragging = document.querySelector(".dragging");

    if(dragging){
        dragging.classList.remove("dragging");
    }

    if(ghost){
        ghost.remove();
        ghost=null;
    }

    touchDraggingID = null;

});

userAvatar.onclick = (e) => {

    // prevent click from triggering document click listener
    e.stopPropagation();

    userMenu.style.display =
        userMenu.style.display === "block"
        ? "none"
        : "block";

};

document.addEventListener("click",(e)=>{

if(!userAvatar.contains(e.target) && !userMenu.contains(e.target)){
    userMenu.style.display="none";
}

});
    
</script>

</body>
</html>
