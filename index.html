<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Expense Tracker</title>

<style>
body{
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto;
background:#f6f7fb;
margin:0;
padding:20px;
display:flex;
justify-content:center;
}

.container{
width:100%;
max-width:500px;
background:white;
padding:25px;
border-radius:14px;
box-shadow:0 10px 25px rgba(0,0,0,0.08);
}

input,select{
width:100%;
padding:14px;
margin-bottom:12px;
border-radius:8px;
border:1px solid #ddd;
font-size:16px;
}

button{
width:100%;
padding:14px;
background:#4caf50;
color:white;
border:none;
border-radius:8px;
font-size:17px;
cursor:pointer;
}

ul{
list-style:none;
padding:0;
}

li{
background:#fafafa;
padding:14px;
margin-bottom:10px;
border-radius:10px;
display:flex;
justify-content:space-between;
align-items:center;
}

.small-btn{
width:auto;
padding:6px 12px;
margin-left:6px;
}

.day-header{
font-weight:bold;
margin-top:20px;
margin-bottom:10px;
}
</style>
</head>

<body>

<div class="container">

<h2>Expense Tracker</h2>

<input id="amount" type="number" placeholder="Amount">

<select id="category">
<option>Food</option>
<option>Travel</option>
<option>Misc</option>
</select>

<input id="note" placeholder="Optional Note">

<button id="addBtn">Add</button>

<h3 id="grandTotal">Grand Total Rs 0</h3>

<ul id="expenseList"></ul>

</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script>

window.onload = function(){

const firebaseConfig={
apiKey:"AIzaSyCCupf8EtI4Lk3bpNFgLs2B_-NsozHQS1g",
authDomain:"expense-tracker-2796a.firebaseapp.com",
databaseURL:"https://expense-tracker-2796a-default-rtdb.firebaseio.com",
projectId:"expense-tracker-2796a",
storageBucket:"expense-tracker-2796a.firebasestorage.app",
messagingSenderId:"246479741004",
appId:"1:246479741004:web:f486279bd9395547e114e9"
};

firebase.initializeApp(firebaseConfig);

const db=firebase.database();
const expensesRef=db.ref("expenses");

let expenses={};
let editingID=null;

const addBtn=document.getElementById("addBtn");

function getLogicalDate(){
const d=new Date();
d.setHours(d.getHours()-7);
return d.toISOString().split("T")[0];
}

expensesRef.on("value",(snapshot)=>{
expenses=snapshot.val()||{};
renderExpenses();
});

function renderExpenses(){

const list=document.getElementById("expenseList");
list.innerHTML="";

let grandTotal=0;
let grouped={};

Object.entries(expenses).forEach(([id,exp])=>{

const date = exp.date || "No Date";

if(!grouped[date]) grouped[date]=[];

grouped[date].push({id,...exp});

grandTotal += Number(exp.amount || 0);

});

document.getElementById("grandTotal").textContent =
"Grand Total Rs "+grandTotal;

Object.entries(grouped).sort().reverse().forEach(([day,entries])=>{

let dayTotal=0;
entries.forEach(e=> dayTotal += Number(e.amount || 0));

const header=document.createElement("div");
header.className="day-header";
header.textContent=`${day} — Daily Total Rs ${dayTotal}`;

list.appendChild(header);

entries.forEach(exp=>{

const li=document.createElement("li");

const text=document.createElement("span");
text.textContent=
`Rs ${exp.amount} - ${exp.category || ''} ${exp.note ? '('+exp.note+')':''}`;

const editBtn=document.createElement("button");
editBtn.textContent="Edit";
editBtn.className="small-btn";

editBtn.onclick=()=>{
document.getElementById("amount").value=exp.amount;
document.getElementById("category").value=exp.category;
document.getElementById("note").value=exp.note;
editingID=exp.id;
addBtn.textContent="Update";
};

const deleteBtn=document.createElement("button");
deleteBtn.textContent="Delete";
deleteBtn.className="small-btn";

deleteBtn.onclick=()=>{
if(confirm("Delete this expense?")){
expensesRef.child(exp.id).remove();
}
};

const btns=document.createElement("div");
btns.appendChild(editBtn);
btns.appendChild(deleteBtn);

li.appendChild(text);
li.appendChild(btns);

list.appendChild(li);

});

});

}

addBtn.onclick = function(){

const amountVal=document.getElementById("amount").value;
const categoryVal=document.getElementById("category").value;
const noteVal=document.getElementById("note").value;

if(!amountVal) return;

const logicalDate=getLogicalDate();

if(editingID){

expensesRef.child(editingID).set({
amount:amountVal,
category:categoryVal,
note:noteVal,
date:logicalDate
});

editingID=null;
addBtn.textContent="Add";

}else{

expensesRef.push({
amount:amountVal,
category:categoryVal,
note:noteVal,
date:logicalDate
});
}

document.getElementById("amount").value="";
document.getElementById("note").value="";
};

};

</script>

</body>
</html>
